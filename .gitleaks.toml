# Gitleaks rules — project-specific secrets.
#
# ## Why this file exists
#
# Gitleaks' built-in ruleset has **no rule for any Supabase key format**. Verified
# 2026-10-03 against gitleaks 8.30.1: a file containing `sb_secret_…`,
# `sb_publishable_…`, or a legacy Supabase service-role JWT scans clean and exits 0.
#
# That is the worst possible gap for this repository. The service-role key is the
# single most damaging secret here — it bypasses row-level security entirely
# (docs/03 §4), so a leaked one hands over the whole database.
#
# `useDefault = true` keeps every built-in rule and adds these on top.
#
# ## Deliberately NOT flagged
#
# `sb_publishable_…` — this is the *anon* key. It is designed to be public and ships
# in the browser bundle via `NEXT_PUBLIC_SUPABASE_ANON_KEY`. Flagging it would train
# everyone to ignore the scanner.
#
# A bare `sk-` — too short and too common. It matches ordinary words and base64
# fragments. `sk-or-v1-` below is specific enough to be worth having.

[extend]
useDefault = true

[[rules]]
id = "supabase-service-key"
description = "Supabase service-role key — bypasses RLS entirely. Never commit."
regex = '''sb_secret_[A-Za-z0-9_\-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-legacy-service-jwt"
description = "Legacy Supabase service-role JWT (the older eyJ… format)."
regex = '''eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{20,}'''
keywords = ["eyJ"]

[[rules]]
id = "openrouter-key"
description = "OpenRouter API key."
regex = '''sk-or-v1-[A-Za-z0-9]{40,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret or restricted key."
regex = '''(whsec_|rk_live_)[A-Za-z0-9]{20,}'''
keywords = ["whsec_", "rk_live_"]
